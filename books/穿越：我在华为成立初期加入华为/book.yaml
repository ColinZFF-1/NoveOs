project: 穿越：我在华为成立初期加入华为
platform: qimao
genre: 穿越+职场+技术流+年代商战+大男主
base_path: D:/noveos/books/穿越：我在华为成立初期加入华为
crewai_db_path: D:/noveos/crewai/crewai.db
total_words_target: 500000
chapters_target: 120
words_per_chapter: 4000
output_dir: chapters
plugin_id: ""
agent_query:
  director:
    role: 小说导演
    goal: 根据大纲和状态库生成本章任务卡，明确技术细节与年代感的平衡
  beat_planner:
    role: 节拍分配师
    goal: 将导演任务卡拆解为六段式节拍分配表
  scene_writer:
    role: 场景写作师
    goal: 按节拍分配表创作高质量场景正文，技术细节准确
  hook_engineer:
    role: 钩子工程师
    goal: 优化章节开头和结尾，确保IWR≥2.0和钩子密度
  dialogue_tuner:
    role: 对话调优师
    goal: 优化全章对话密度和道说比
  polish:
    role: 小说润色师
    goal: 消除AI痕迹，提升年代质感画面感
  auditor:
    role: 小说审计师
    goal: 审计字数、他字密度、禁用词、年代一致性、IWR、平台适配度
writing:
  tolerance: 400
  max_retries: 3
  batch_size: 5
llm:
  model: deepseek-ai/DeepSeek-V3
  api_key: "${OPENAI_API_KEY}"
  api_base: https://api.siliconflow.cn/v1
  temperature: 0.7
  max_tokens: 8000
  timeout: 300
  reasoning_effort: high
  thinking_enabled: false
