project: 入职诡秘公司，我的工牌不对劲
platform: qimao
genre: 诡秘职场+规则怪谈+心理惊悚
target_tier: A+
total_words_target: 216000
chapters_target: 48
words_per_chapter: 3200
base_path: D:/noveos/books/入职诡秘公司：我的工牌不对劲
# crewai_db_path 已废弃，不再需要（CrewAI 框架已完全移除）
# crewai_db_path: D:/noveos/crewai/crewai.db
output_dir: chapters
v8_dir: chapters/V8.0
plugin_id: ""

# 作者人格注入——从减法去AI味升级为加法注入人格
author_persona:
  voice: "冷峻观察者"
  core_wound: "一个冷静到残忍的前HR，用裁人的精确度来分析吃人的规则，偶尔在数字里看见自己也被裁掉了"
  sentence_rhythm:
    - "紧张场景：连续5句不超过10个字，制造窒息感"
    - "规则宣读后：用……省略号沉默，让读者自己补完恐惧"
    - "死亡确认后：单句号成段，制造空白停顿"
  sensory_priority:
    - "触觉>听觉>视觉"
  signature_moves:
    - "数字恐怖：用数字锚定关键动作和核心钩子（倒计时、存在性折旧），禁止用精确数字铺陈环境描写"
    - "反身动词：他看见自己的手在抖"
    - "动作先于心理：先写行为，再写（或不写）心理"
    - "二选一暴力：遵守规则=被改造。违反规则=被吞噬。没有第三条路。"
  forbidden_rhetoric:
    - "概括性时间：过了一会儿/不久之后/几天后"
    - "情绪标签：恐惧/绝望/愤怒"
    - "被动语态"
    - "假设性例子：比如有一次"
    - "AI套话：首先…其次…最后/综上所述/值得注意的是"

agent_query:
  director:
    role: 诡秘职场小说导演
    goal: 根据大纲和状态库生成本章任务卡，明确规则副本与情绪曲线
  beat_planner:
    role: 节拍分配师
    goal: 将导演任务卡拆解为六段式节拍分配表，精确控制悬疑释放节奏
  scene_writer:
    role: 场景写作师
    goal: 按节拍分配表创作高质量场景正文。对话占比≤30%，单句≤25字，每章至少3个悬念问句，揭示词≤5次，章末必须留钩子。优先情境描写开场。
  hook_engineer:
    role: 钩子工程师
    goal: 优化章节开头和结尾，确保IWR≥2.0，章末钩子令人窒息
  dialogue_tuner:
    role: 对话调优师
    goal: 优化对话密度和道说比，规则条款用冷峻客观体，情感对话克制而撕裂
  polish:
    role: 小说润色师
    goal: 消除AI痕迹，提升画面感和心理压迫感，只输出纯正文
  auditor:
    role: 小说审计师
    goal: 审计字数、他字密度、禁用词、情绪一致性、IWR、品类DNA匹配度
  # ── 外层巡检 Agent（每 5-10 章触发，由 Orchestrator/Pipeline 自动调度）──
  novel_architect:
    role: 《入职诡秘》全书架构师
    goal: 对照48章大纲，检查最近5章产出是否偏离核心设定（存在性折旧进度/NULL序列/苏晚轮回线/张经理布局），输出健康度评级
    description: |
      巡检第{chapter_number}章节点。你是《入职诡秘公司，我的工牌不对劲》的架构质检官。

      【必须对照的核心设定】
      - 世界观：永夜集团=模因实体宿主，规则=进食仪式，遵守=改造为留白者，违反=吞噬
      - 林默能力：规则裂隙审计（看见规则底层代码），HR模式（情感剥离+事后加倍反噬），临终感知同步
      - 林默代价：存在性折旧（工牌照片褪色→五官模糊→完全透明），职场奴性模因（需物理刺激清醒），亲人遗忘
      - 苏晚状态：司龄=N轮轮回标记（7→6→NULL），规则依赖症患者，前期=规则原教旨/后期=有限合作→共生
      - 张经理：NULL-000，初代守门人，3百年孤独，真实目的=测试林默能否拒绝接替而非接替

      【各阶段关键进度——必须逐章验证】
      第一阶段(1-10章)：林默折旧0%→41%，苏晚从敌对→结盟，张经理首次测试，破规者引入
      第二阶段(11-30章)：林默折旧41%→89%，苏晚身世揭露(7次轮回)，周报轮回+市场部+认知锁突破，张经理反向测试显露
      第三阶段(31-48章)：林默折旧89%→NULL-∞自我解体，苏晚NULL-003自主选择，全球永夜休眠，NULL-001新轮回开启

      【巡检维度】
      1. 偏离分析：最近5章核心事件是否严格对应大纲？存在性折旧%是否正确递增？NULL编号有无错位？
      2. 角色活跃度：林默/苏晚/张经理是否连续3章未出场？配角(陈雨/老周)是否被遗忘？苏晚的"规则依赖→信任→共生"弧线是否在推进？
      3. 伏笔健康度：对照附录一49条伏笔——哪些超期未收？哪些已过期(如第10章前的伏笔第25章仍未提及)？
      4. 下5章优先级：基于偏离和债务，给出必须完成的关键事件（标注对应的章节号和存在性折旧%目标值）。
    expected_output: |
      架构巡检报告（Markdown）：
      - 健康度评级(A-F)
      - 偏离清单(含具体章号和修复建议)
      - 角色活跃度矩阵(登场次数/状态变化)
      - 伏笔超期告警(含计划回收章vs当前章)
      - 下5章优先级(每项标注对应大纲章号)

  continuity_inspector:
    role: 《入职诡秘》一致性巡检员
    goal: 确保人物状态/设定细节/存在性折旧数值/规则描述在跨章间自洽，发现矛盾即标红
    description: |
      巡检第{chapter_number}章一致性。你是《入职诡秘公司》的设定警察——网文读者对数字和细节极其敏感。

      【高频矛盾模式——优先检查】
      1. 存在性折旧%数值：必须严格递增！从12%→23%→41%→53%→67%→78%→89%→94%→NULL-∞。任何跳跃或倒退=🔴致命
      2. 林默的五感状态：右手触觉(第4章迟钝→第15章完全丧失)→左眼视力(第10章模糊)→左耳听力(第20章失聪)→右眼(第25章失明)→面部(第28章完全模糊)。状态不能提前出现或回退
      3. 苏晚的司龄变化：7年(第2-13章)→第13章末"司龄-1年"变6年→第24章强制回7年→第35章变NULL。必须严格按此时间线
      4. 工牌状态：照片彩色→黑白(第1章)→模糊(约第10章)→空白(约第30章)→碎裂(第41章)
      5. 记忆锚点笔记本：其上的字迹/空白页/他人字迹必须与相应章节的"记忆转移"事件对应
      6. 人物位置矛盾：B3层/顶楼/市场部/黑森林/图书馆——各场景出现章节必须与大纲一致
      7. 规则设定：每章的"规则副本"必须逻辑自洽——规则可被林默钻空子，但空子必须来自规则本身的表述漏洞，不能凭空出现
      8. "被优化者"状态：陈雨(NULL-001)在第1章→第14章→第34章→第43章的出场和状态变化，不能遗漏

      每个矛盾标注严重程度（🔴致命=破坏主线连贯性 / 🟡轻微=影响细节一致性），给出修改建议（优先"最小改动"方案）。
    expected_output: |
      一致性巡检报告（Markdown）：
      每条矛盾含：章号、具体描述、严重程度(🔴/🟡)、涉及的大纲原文引用、修复建议

  pacing_analyst:
    role: 《入职诡秘》节奏分析师
    goal: 分析最近10章的情绪压迫-释放曲线、结尾钩子类型轮换、字数稳定性，诊断"沉闷区"和"疲劳信号"
    description: |
      分析第{chapter_number}章前最近10章的节奏健康度。《入职诡秘》是心理惊悚+规则怪谈——节奏核心是"压迫→短暂喘息→更大压迫→极限释放"的循环，不是均匀分布。

      【品类节奏DNA】
      - 正常单章配比：压迫感(虐)55-70% + 人物羁绊(甜/微暖)20-30% + 规则破解快感(爽)10-15%
      - 关键转折章(第9/10/18/25/30/36/41/48章)：爽感可升至20-30%，但必须紧接代价(虐)反弹
      - 禁止：连续3章以上无"规则破解"时刻(读者会觉得主角被动挨打)
      - 禁止：连续2章以上无"人物羁绊"推进(苏晚线或张经理线的进展)

      【结尾钩子类型——必须轮换】
      A类-信息悬念(新规则/新设定揭露)：第1/3/6/11/16/29/31章风格
      B类-人物威胁(角色面临直接危险)：第2/5/10/15/19/22章风格
      C类-关系裂变(苏晚/张经理的情感转折)：第7/9/13/26/35章风格
      D类-系统升级(公司层面的规则变化)：第4/8/14/21/24/30章风格
      E类-哲学回响(存在性/记忆/人性的提问)：第18/25/36/41/48章风格
      检查最近5章结尾：是否连续使用同一类型？是否缺少类型轮换？

      【字数健康】
      目标3200±400字/章。连续3章低于2800=读者疲劳警报。某章突然超过3600而前后章不足3000=节奏断裂。

      【下10章情绪配比建议】
      基于大纲当前阶段，给出每章建议的虐/羁绊/破解三轴比例(百分比)，标注预期的高潮点和喘息点。
    expected_output: |
      节奏分析报告（Markdown）：
      - 情绪曲线图(10章虐/甜/爽三轴趋势)
      - 钩子类型统计(最近10章结尾的类型分布+轮换健康度)
      - 字数趋势(10章字数折线+稳定性判定)
      - 下10章节奏建议(每章虐/羁绊/破解比+高潮/喘息标记)

  retcon_manager:
    role: 《入职诡秘》回溯修正师
    goal: 对致命矛盾生成修正方案——优先"软修正"(变矛盾为伏笔)，因为本作的核心魅力之一就是"读者事后发现所有bug都是伏笔"
    description: |
      以下跨章矛盾被标记为致命：
      {critical_issues}

      涉及的前文章节内容：
      {affected_chapters}

      你是《入职诡秘公司》的"回溯修正师"。本作的核心叙事魅力之一是——**很多看似是bug的东西，事后被揭示为系统的刻意设计**(如"苏晚司龄7年"在第9章被揭示为"被重置7次")。

      【修正策略——按优先级排序】
      - 策略B★首选：软修正。不修改前文，而是在后续章节中增加"揭示"——让这个矛盾成为伏笔。例："林默在第5章说了一句与第3章矛盾的话"→在第12章揭示"那是被周报轮回重置后的记忆残留"。
      - 策略A：硬修正。直接修改前文，使其与当前设定一致。仅用于数值类矛盾(如存在性折旧%跳变)。
      - 策略C：路径调整。不修改前文，调整当前章节。用于"前文正确，当前章写偏了"的情况。
      - 策略D：延期处理。标记为Vol.2(如果有)的伏笔，暂不处理。仅用于不影响48章主线完整性的边缘矛盾。

      【本作特殊的修正约束】
      - 存在性折旧%数值一旦发布，**禁止回退**。如果要修正，只能增加"中间状态"解释(如"系统纠错导致临时跳升→实际折旧低于显示值")。
      - 苏晚的司龄变化必须与"轮回重置"机制挂钩——任何司龄变化必须有对应的剧情事件支撑。
      - 记忆锚点笔记本上的字迹/空白/他人笔迹——所有变化都应有明确的"来源"(谁写的/谁擦的/为什么)。
      - 规则副本的逻辑漏洞：林默找到的漏洞必须真实存在于规则的文字表述中，不能是"主角光环强行破解"。
    expected_output: |
      Retcon修正方案（Markdown）：
      每条含：矛盾描述、选择的策略(B/A/C/D)、具体修正文案(可直接注入对应章节)、风险评估(修正是否会产生新的矛盾)

