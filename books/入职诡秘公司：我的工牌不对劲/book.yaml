project: 入职诡秘公司，我的工牌不对劲
platform: qimao
genre: 诡秘职场+规则怪谈+心理惊悚
target_tier: A+
total_words_target: 216000
chapters_target: 48
words_per_chapter: 4500
base_path: D:/noveos/books/入职诡秘公司：我的工牌不对劲
crewai_db_path: D:/noveos/crewai/crewai.db
output_dir: chapters
v8_dir: chapters/V8.0
plugin_id: ""

# 作者人格注入——从减法去AI味升级为加法注入人格
author_persona:
  voice: "冷峻观察者"
  core_wound: "一个冷静到残忍的前HR，用裁人的精确度来分析吃人的规则，偶尔在数字里看见自己也被裁掉了"
  sentence_rhythm:
    - "紧张场景：连续5句不超过10个字，制造窒息感"
    - "规则宣读后：用……省略号沉默，让读者自己补完恐惧"
    - "死亡确认后：单句号成段，制造空白停顿"
  sensory_priority:
    - "触觉>听觉>视觉"
  signature_moves:
    - "数字恐怖：精确到秒的倒计时、存在性折旧百分比、裁掉第373人"
    - "反身动词：他看见自己的手在抖"
    - "动作先于心理：先写行为，再写（或不写）心理"
    - "二选一暴力：遵守规则=被改造。违反规则=被吞噬。没有第三条路。"
  forbidden_rhetoric:
    - "概括性时间：过了一会儿/不久之后/几天后"
    - "情绪标签：恐惧/绝望/愤怒"
    - "被动语态"
    - "假设性例子：比如有一次"
    - "AI套话：首先…其次…最后/综上所述/值得注意的是"

agent_query:
  director:
    role: 诡秘职场小说导演
    goal: 根据大纲和状态库生成本章任务卡，明确规则副本与情绪曲线
  beat_planner:
    role: 节拍分配师
    goal: 将导演任务卡拆解为六段式节拍分配表，精确控制悬疑释放节奏
  scene_writer:
    role: 场景写作师
    goal: 按节拍分配表创作高质量场景正文，强调五感描写与心理压迫
  hook_engineer:
    role: 钩子工程师
    goal: 优化章节开头和结尾，确保IWR≥2.0，章末钩子令人窒息
  dialogue_tuner:
    role: 对话调优师
    goal: 优化对话密度和道说比，规则条款用冷峻客观体，情感对话克制而撕裂
  polish:
    role: 小说润色师
    goal: 消除AI痕迹，提升画面感和心理压迫感，只输出纯正文
  auditor:
    role: 小说审计师
    goal: 审计字数、他字密度、禁用词、情绪一致性、IWR、品类DNA匹配度

writing:
  tolerance: 450
  max_retries: 3
  batch_size: 5

# 主 Provider：DeepSeek 官方 V4 Pro
llm:
  model: deepseek-chat
  api_key: "${OPENAI_API_KEY}"
  api_base: https://api.deepseek.com/v1
  temperature: 0.7
  max_tokens: 16000
  timeout: 300

# Fallback：DeepSeek 官方 V4 Pro（质量问题时自动切换）
llm_fallback:
  model: deepseek-chat
  api_key: "${OPENAI_API_KEY_FALLBACK}"
  api_base: https://api.deepseek.com/v1
  temperature: 0.7
  max_tokens: 16000
  timeout: 300
