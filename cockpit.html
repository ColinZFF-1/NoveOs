// ==================== API LAYER ====================
let apiConnected = false;
let currentProject = MOCK.projects[0];

async function apiCall(path, options = {}) {
  try {
    const res = await fetch(`${API_BASE}${path}`, { ...options, headers: { 'Content-Type': 'application/json', ...options.headers } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    apiConnected = true;
    updateConnectionStatus();
    return await res.json();
  } catch (e) {
    apiConnected = false;
    updateConnectionStatus();
    return null;
  }
}

function updateConnectionStatus() {
  const dot = document.getElementById('conn-indicator');
  const text = document.getElementById('conn-text');
  if (!dot || !text) return;
  if (apiConnected) {
    dot.className = 'w-2 h-2 rounded-full bg-cockpit-success';
    text.textContent = '已连接';
  } else {
    dot.className = 'w-2 h-2 rounded-full bg-cockpit-warning';
    text.textContent = '模拟模式';
  }
}

async function fetchSystemStats() {
  const data = await apiCall('/system/stats');
  return data?.data || MOCK.system;
}

async function fetchProjects() {
  const data = await apiCall('/projects');
  return data?.data || MOCK.projects;
}

async function fetchPipelineStatus(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/pipeline`);
  return data?.data || MOCK.pipeline;
}

async function fetchChapters(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/chapters`);
  return data?.data || MOCK.chapters;
}

async function fetchCharacters(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/characters`);
  return data?.data || MOCK.characters;
}

async function fetchDebts(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/debts`);
  return data?.data || MOCK.debts;
}

async function fetchForeshadowing(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/foreshadowing`);
  return data?.data || MOCK.foreshadowing;
}

async function fetchEmotions(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/emotions`);
  return data?.data || MOCK.emotion_history;
}

async function fetchMetrics(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/metrics`);
  return data?.data || MOCK.metrics;
}

async function fetchGuards(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/guards`);
  return data?.data || { guards: MOCK.guards };
}

async function fetchLogs(pid) {
  const data = await apiCall(`/projects/${encodeURIComponent(pid)}/logs?limit=50`);
  return data?.data || MOCK.logs;
}

async function controlPipeline(pid, action) {
  return await apiCall(`/projects/${encodeURIComponent(pid)}/pipeline/${action}`, { method: 'POST' });
}

// ==================== ROUTER ====================
let currentView = 'overview';
let charts = {};

function navigate(view) {
  currentView = view;
  window.location.hash = view;
  renderSidebar();
  renderContent();
  document.getElementById('page-title').textContent = NAV_ITEMS.find(n => n.id === view)?.label || '概览';
}

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = NAV_ITEMS.map(item => `
    <div class="nav-item flex items-center gap-3 px-3 py-2.5 text-xs font-medium cursor-pointer ${item.id === currentView ? 'active' : 'text-cockpit-textMuted'}"
         onclick="navigate('${item.id}')">
      ${item.icon}
      <span>${item.label}</span>
    </div>
  `).join('');
}

function renderContent() {
  const content = document.getElementById('app-content');
  // Destroy old charts
  Object.values(charts).forEach(c => c.destroy?.());
  charts = {};
  
  switch (currentView) {
    case 'overview': renderOverview(content); break;
    case 'projects': renderProjects(content); break;
    case 'progress': renderProgress(content); break;
    case 'quality': renderQuality(content); break;
    case 'story': renderStory(content); break;
    case 'logs': renderLogs(content); break;
    case 'analytics': renderAnalytics(content); break;
    default: renderOverview(content);
  }
}

// ==================== UTILS ====================
function fmtNum(n) { return n == null ? '-' : n.toLocaleString(); }
function badgeClass(level) {
  if (level === 'PASS') return 'badge-pass';
  if (level === 'WARN') return 'badge-warn';
  if (level === 'BLOCK' || level === 'BLOCKING') return 'badge-block';
  if (level === 'PENDING') return 'badge-stopped';
  return 'badge-stopped';
}
function chCellClass(ch) {
  if (ch.gate_level === 'PASS') return 'ch-pass';
  if (ch.gate_level === 'WARN') return 'ch-warn';
  if (ch.gate_level === 'BLOCK') return 'ch-block';
  if (ch.gate_level === 'PENDING' && ch.word_count > 0) return 'ch-writing';
  return 'ch-pending';
}

            <div class="text-[9px] text-cockpit-textMuted text-center py-1">玄幻</div>
            <div class="text-[9px] text-cockpit-textMuted text-center py-1">竞技</div>
            <div class="text-[9px] text-cockpit-textMuted text-center py-1">历史</div>
            <div class="text-[9px] text-cockpit-textMuted text-center py-1">都市</div>
            <div class="text-[9px] text-cockpit-textMuted text-center py-1">科幻</div>
            <div class="text-[9px] text-cockpit-textMuted text-center py-1">武侠</div>
            <div class="text-[9px] text-cockpit-textMuted text-center py-1">穿越</div>
            
            ${['恐怖','玄幻','竞技','历史','都市','科幻','武侠','穿越'].map((g, i) => {
              const row = [100,58,72,83,79,83,85,80, 58,100,57,65,60,60,60,58, 72,57,100,75,72,87,78,74, 83,65,75,100,93,83,92,92, 79,60,72,93,100,79,91,97, 83,60,87,83,79,100,88,82, 85,60,78,92,91,88,100,93, 80,58,74,92,97,82,93,100];
              const base = i * 8;
              return `
                <div class="text-[9px] text-cockpit-textMuted flex items-center pr-1">${g}</div>
                ${[0,1,2,3,4,5,6,7].map(j => {
                  const val = row[base + j];
                  const opacity = Math.max(0.04, val / 100 * 0.2);
                  return `<div class="hm-cell" style="background:rgba(255,255,255,${opacity})">${val}</div>`;
                }).join('')}
              `;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
  
  setTimeout(() => {
    const genres = Object.entries(MOCK.rag.genre_summaries);
    
    const sizeCtx = document.getElementById('genreSizeChart');
    if (sizeCtx) {
      charts.genreSize = new Chart(sizeCtx, {
        type: 'bar',
        data: {
          labels: genres.map(g => g[0].replace('小说','')),
          datasets: [{
            label: '字数（万）',
            data: genres.map(g => (g[1].total_cn / 10000).toFixed(0)),
            backgroundColor: ['#AF52DE','#007AFF','#5AC8FA','#FF9500','#34C759','#FF2D55','#FFD700','#FF6B35'],
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6e6e73', font: { size: 10 } } },
            y: { grid: { display: false }, ticks: { color: '#a1a1a6', font: { size: 11 } } },
          }
        }
      });
    }
    
    const scatterCtx = document.getElementById('genreScatterChart');
    if (scatterCtx) {
      charts.genreScatter = new Chart(scatterCtx, {
        type: 'bubble',
        data: {
          datasets: genres.map((g, i) => ({
            label: g[0].replace('小说',''),
            data: [{ x: g[1].avg_dial_pct, y: g[1].avg_ta_density, r: Math.sqrt(g[1].total_cn) / 300 }],
            backgroundColor: ['#AF52DE','#007AFF','#5AC8FA','#FF9500','#34C759','#FF2D55','#FFD700','#FF6B35'][i],
          }))
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#86868B', font: { size: 10 } } } },
          scales: {
            x: { title: { display: true, text: '对话占比 %', color: '#6e6e73', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6e6e73' } },
            y: { title: { display: true, text: '他字密度 %', color: '#6e6e73', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6e6e73' } },
          }
        }
      });
    }
    
    const bingeCtx = document.getElementById('bingeChart');
    if (bingeCtx) {
      charts.binge = new Chart(bingeCtx, {
        type: 'bar',
        data: {
          labels: MOCK.rag.top_binge.map(b => b.name.length > 8 ? b.name.slice(0,8) + '...' : b.name),
          datasets: [{
            label: '追读基因分',
            data: MOCK.rag.top_binge.map(b => b.binge_score),
            backgroundColor: ['#FF2D55','#FF2D55','#FF9500','#FF9500','#FF9500'],
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6e6e73', font: { size: 10 } } },
            y: { grid: { display: false }, ticks: { color: '#a1a1a6', font: { size: 10 } } },
          }
        }
      });
    }
  }, 50);
}

// ==================== ACTIONS ====================
async function startPipeline() {
  const btn = event.target.closest('button');
  btn.disabled = true;
  btn.innerHTML = '<svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> 启动中...';
  const res = await controlPipeline(currentProject.project_id, 'start');
  alert(res ? '流水线已启动' : '启动请求已发送（后端未连接，请在模拟模式下操作）');
  setTimeout(refreshAll, 1000);
}

async function pausePipeline() {
  const res = await controlPipeline(currentProject.project_id, 'pause');
  alert(res ? '流水线已暂停' : '暂停请求已发送');
  setTimeout(refreshAll, 1000);
}

async function stopPipeline() {
  if (!confirm('确定要停止流水线吗？')) return;
  const res = await controlPipeline(currentProject.project_id, 'stop');
  alert(res ? '流水线已停止' : '停止请求已发送');
  setTimeout(refreshAll, 1000);
}

async function resumePipeline() {
  const res = await controlPipeline(currentProject.project_id, 'start');
  alert(res ? '已恢复写作' : '恢复请求已发送');
  setTimeout(refreshAll, 1000);
}

function showChapterDetail(chapterNum) {
  alert(`第${chapterNum}章详情\n\n实际功能：调用 GET /api/v1/projects/{pid}/chapters/${chapterNum}/content 获取正文`);
}

async function refreshAll() {
  renderContent();
}

// ==================== INIT ====================
function init() {
  // Handle hash routing
  const hash = window.location.hash.slice(1) || 'overview';
  navigate(hash);
  
  // Poll for updates
  setInterval(() => {
    if (currentView === 'overview' || currentView === 'logs') {
      // Only auto-refresh certain views
    }
  }, POLL_INTERVAL);
}

window.addEventListener('hashchange', () => {
  navigate(window.location.hash.slice(1) || 'overview');
});

// Start
init();
</script>
